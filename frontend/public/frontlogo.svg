<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161B22;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="520" height="160" rx="18" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="0.5" y="0.5" width="519" height="159" rx="17.5" fill="none" stroke="#30363D" stroke-width="1"/>

  <!-- LEFT PANEL (red/minus) -->
  <g transform="translate(28, 52)">
    <rect x="0" y="0" width="38" height="56" rx="6" fill="#1A0A0A"/>
    <rect x="0" y="0" width="38" height="56" rx="6" fill="none" stroke="#FF6B6B" stroke-width="1.2" stroke-opacity="0.5"/>
    <rect x="0" y="18" width="38" height="11" fill="#FF6B6B" fill-opacity="0.18"/>
    <rect x="5" y="21" width="6" height="5" rx="1" fill="#FF6B6B" fill-opacity="0.9"/>
    <rect x="13" y="23" width="16" height="2" rx="1" fill="#FF6B6B" fill-opacity="0.7"/>
    <rect x="5" y="8" width="20" height="2" rx="1" fill="#FF6B6B" fill-opacity="0.25"/>
    <rect x="5" y="12" width="14" height="2" rx="1" fill="#FF6B6B" fill-opacity="0.25"/>
    <rect x="5" y="33" width="18" height="2" rx="1" fill="#FF6B6B" fill-opacity="0.25"/>
    <rect x="5" y="37" width="12" height="2" rx="1" fill="#FF6B6B" fill-opacity="0.25"/>
    <rect x="5" y="41" width="22" height="2" rx="1" fill="#FF6B6B" fill-opacity="0.25"/>
    <rect x="5" y="45" width="10" height="2" rx="1" fill="#FF6B6B" fill-opacity="0.25"/>
  </g>

  <!-- CENTER DIVIDER with arrow -->
  <g transform="translate(68, 68)">
    <line x1="6" y1="0" x2="6" y2="24" stroke="#4B5563" stroke-width="1" stroke-dasharray="2,2"/>
    <polyline points="2,12 10,8 10,16 2,12" fill="#6EE7B7" fill-opacity="0.8"/>
  </g>

  <!-- RIGHT PANEL (green/plus) -->
  <g transform="translate(82, 52)">
    <rect x="0" y="0" width="38" height="56" rx="6" fill="#071A0F"/>
    <rect x="0" y="0" width="38" height="56" rx="6" fill="none" stroke="#4ADE80" stroke-width="1.2" stroke-opacity="0.5"/>
    <rect x="0" y="18" width="38" height="11" fill="#4ADE80" fill-opacity="0.15"/>
    <rect x="5" y="21" width="6" height="5" rx="1" fill="#4ADE80" fill-opacity="0.9"/>
    <rect x="13" y="23" width="16" height="2" rx="1" fill="#4ADE80" fill-opacity="0.7"/>
    <rect x="20" y="19" width="2" height="10" rx="1" fill="#4ADE80" fill-opacity="0.7"/>
    <rect x="5" y="8" width="20" height="2" rx="1" fill="#4ADE80" fill-opacity="0.25"/>
    <rect x="5" y="12" width="14" height="2" rx="1" fill="#4ADE80" fill-opacity="0.25"/>
    <rect x="5" y="33" width="18" height="2" rx="1" fill="#4ADE80" fill-opacity="0.25"/>
    <rect x="5" y="37" width="12" height="2" rx="1" fill="#4ADE80" fill-opacity="0.25"/>
    <rect x="5" y="41" width="22" height="2" rx="1" fill="#4ADE80" fill-opacity="0.25"/>
    <rect x="5" y="45" width="16" height="2" rx="1" fill="#4ADE80" fill-opacity="0.25"/>
  </g>

  <!-- Red/green dot accents -->
  <circle cx="158" cy="76" r="3.5" fill="#FF6B6B" opacity="0.85"/>
  <circle cx="158" cy="90" r="3.5" fill="#4ADE80" opacity="0.85"/>

  <!-- Wordmark: Diff-Inspector -->
  <text x="168" y="88" font-family="'Courier New', Courier, monospace" font-size="36" font-weight="700" letter-spacing="0">
    <tspan fill="#F0F6FC">Diff</tspan><tspan fill="#6EE7B7">-</tspan><tspan fill="#58A6FF">Inspector</tspan>
  </text>

  <!-- Separator line -->
  <line x1="168" y1="96" x2="468" y2="96" stroke="#21262D" stroke-width="1"/>

  <!-- Tagline -->
  <text x="169" y="112" font-family="'Courier New', Courier, monospace" font-size="11" letter-spacing="2.5" fill="#8B949E">COMPARE · ANALYZE · INSPECT</text>
</svg>
