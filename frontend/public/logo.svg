<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161B22;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="160" height="160" rx="18" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="0.5" y="0.5" width="159" height="159" rx="17.5" fill="none" stroke="#30363D" stroke-width="1"/>

  <!-- LEFT PANEL (red/minus) -->
  <g transform="translate(16, 52)">
    <rect x="0" y="0" width="48" height="60" rx="7" fill="#1A0A0A"/>
    <rect x="0" y="0" width="48" height="60" rx="7" fill="none" stroke="#FF6B6B" stroke-width="1.4" stroke-opacity="0.5"/>
    <rect x="0" y="19" width="48" height="13" fill="#FF6B6B" fill-opacity="0.18"/>
    <rect x="6" y="22" width="8" height="6" rx="1.5" fill="#FF6B6B" fill-opacity="0.9"/>
    <rect x="17" y="24" width="20" height="2.5" rx="1" fill="#FF6B6B" fill-opacity="0.7"/>
    <rect x="6" y="8" width="26" height="2.5" rx="1" fill="#FF6B6B" fill-opacity="0.25"/>
    <rect x="6" y="13" width="18" height="2.5" rx="1" fill="#FF6B6B" fill-opacity="0.25"/>
    <rect x="6" y="36" width="22" height="2.5" rx="1" fill="#FF6B6B" fill-opacity="0.25"/>
    <rect x="6" y="41" width="15" height="2.5" rx="1" fill="#FF6B6B" fill-opacity="0.25"/>
    <rect x="6" y="46" width="28" height="2.5" rx="1" fill="#FF6B6B" fill-opacity="0.25"/>
    <rect x="6" y="51" width="12" height="2.5" rx="1" fill="#FF6B6B" fill-opacity="0.25"/>
  </g>

  <!-- CENTER DIVIDER with arrow -->
  <g transform="translate(68, 68)">
    <line x1="12" y1="0" x2="12" y2="28" stroke="#4B5563" stroke-width="1" stroke-dasharray="2,2"/>
    <polyline points="6,14 18,9 18,19 6,14" fill="#6EE7B7" fill-opacity="0.85"/>
  </g>

  <!-- RIGHT PANEL (green/plus) -->
  <g transform="translate(96, 52)">
    <rect x="0" y="0" width="48" height="60" rx="7" fill="#071A0F"/>
    <rect x="0" y="0" width="48" height="60" rx="7" fill="none" stroke="#4ADE80" stroke-width="1.4" stroke-opacity="0.5"/>
    <rect x="0" y="19" width="48" height="13" fill="#4ADE80" fill-opacity="0.15"/>
    <rect x="6" y="22" width="8" height="6" rx="1.5" fill="#4ADE80" fill-opacity="0.9"/>
    <rect x="17" y="24" width="20" height="2.5" rx="1" fill="#4ADE80" fill-opacity="0.7"/>
    <rect x="26" y="20" width="2.5" height="12" rx="1" fill="#4ADE80" fill-opacity="0.7"/>
    <rect x="6" y="8" width="26" height="2.5" rx="1" fill="#4ADE80" fill-opacity="0.25"/>
    <rect x="6" y="13" width="18" height="2.5" rx="1" fill="#4ADE80" fill-opacity="0.25"/>
    <rect x="6" y="36" width="22" height="2.5" rx="1" fill="#4ADE80" fill-opacity="0.25"/>
    <rect x="6" y="41" width="15" height="2.5" rx="1" fill="#4ADE80" fill-opacity="0.25"/>
    <rect x="6" y="46" width="28" height="2.5" rx="1" fill="#4ADE80" fill-opacity="0.25"/>
    <rect x="6" y="51" width="20" height="2.5" rx="1" fill="#4ADE80" fill-opacity="0.25"/>
  </g>
</svg>
